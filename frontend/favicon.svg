<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#141B30"/>
    </linearGradient>
    <linearGradient id="body" x1="16" y1="20" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="screen" x1="20" y1="24" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="17" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none"/>

  <!-- Antenna -->
  <line x1="32" y1="17" x2="32" y2="10" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="9" r="4" fill="#3B82F6" filter="url(#cyanGlow)"/>
  <circle cx="32" cy="9" r="1.5" fill="#60A5FA"/>

  <!-- Ears -->
  <rect x="14" y="27" width="4" height="10" rx="2" fill="#3B82F6"/>
  <rect x="46" y="27" width="4" height="10" rx="2" fill="#3B82F6"/>

  <!-- Body Outer Shell -->
  <rect x="18" y="20" width="28" height="24" rx="12" fill="url(#body)" stroke="#94A3B8" stroke-width="1"/>

  <!-- Visor Screen -->
  <rect x="21" y="24" width="22" height="16" rx="7" fill="url(#screen)"/>
  <rect x="22" y="25" width="20" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- Glowing Cyan Eyes (Happy ^ ^) -->
  <path d="M25 31 Q27.5 28 30 31" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#cyanGlow)"/>
  <path d="M34 31 Q36.5 28 39 31" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#cyanGlow)"/>
  
  <!-- Smile -->
  <path d="M30 35 Q32 37 34 35" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Chest Core Badge -->
  <circle cx="32" cy="48" r="3" fill="#14B8A6" filter="url(#cyanGlow)"/>
  <circle cx="32" cy="48" r="1.2" fill="#5EEAD4"/>
</svg>